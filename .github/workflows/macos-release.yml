name: macos-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  macos-arm64:
    name: macOS arm64 signed release
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require release tag on Apple Silicon
        run: |
          set -euo pipefail
          test "${GITHUB_REF_TYPE}" = "tag"
          test "$(uname -m)" = "arm64"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          set -euo pipefail
          corepack enable
          pnpm --version

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.5.0
          dune-cache: true

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install OCaml dependencies
        working-directory: runtime/ocaml
        run: |
          set -euo pipefail
          opam install . --deps-only --with-test --with-doc --yes
          opam install alcotest ocamlformat.0.29.0 odoc --yes

      - name: Prepare signing and update inputs
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NYX_PROD_UPDATE_FEED_URL_VALUE: ${{ vars.NYX_PROD_UPDATE_FEED_URL || secrets.NYX_PROD_UPDATE_FEED_URL }}
        run: |
          set -euo pipefail
          : "${MACOS_CERTIFICATE_P12_BASE64:?MACOS_CERTIFICATE_P12_BASE64 secret is required}"
          : "${MACOS_CERTIFICATE_PASSWORD:?MACOS_CERTIFICATE_PASSWORD secret is required}"
          : "${APPLE_API_KEY:?APPLE_API_KEY secret is required}"
          : "${APPLE_API_KEY_ID:?APPLE_API_KEY_ID secret is required}"
          : "${APPLE_API_ISSUER:?APPLE_API_ISSUER secret is required}"
          : "${NYX_PROD_UPDATE_FEED_URL_VALUE:?NYX_PROD_UPDATE_FEED_URL variable or secret is required}"

          certificate_path="${RUNNER_TEMP}/nyx-developer-id.p12"
          printf '%s' "${MACOS_CERTIFICATE_P12_BASE64}" | base64 --decode > "${certificate_path}"
          chmod 0600 "${certificate_path}"

          api_key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "${APPLE_API_KEY}" > "${api_key_path}"
          chmod 0600 "${api_key_path}"

          {
            printf 'CSC_LINK=%s\n' "${certificate_path}"
            printf 'CSC_KEY_PASSWORD=%s\n' "${MACOS_CERTIFICATE_PASSWORD}"
            printf 'APPLE_API_KEY=%s\n' "${api_key_path}"
            printf 'APPLE_API_KEY_ID=%s\n' "${APPLE_API_KEY_ID}"
            printf 'APPLE_API_ISSUER=%s\n' "${APPLE_API_ISSUER}"
            printf 'NYX_PROD_UPDATE_FEED_URL=%s\n' "${NYX_PROD_UPDATE_FEED_URL_VALUE}"
          } >> "${GITHUB_ENV}"

      - name: Verify desktop static checks
        run: |
          set -euo pipefail
          pnpm --dir apps/desktop typecheck
          pnpm --dir apps/desktop typecheck:compat
          pnpm --dir apps/desktop lint

      - name: Verify runtime-backed chat state
        run: scripts/check-runtime-chat-state.sh

      - name: Build desktop
        run: pnpm --dir apps/desktop build

      - name: Package signed macOS production artifacts
        run: pnpm --dir apps/desktop package:mac:prod

      - name: Verify signed macOS production artifacts
        run: pnpm --dir apps/desktop release:mac:verify

      - name: Collect release artifacts
        id: artifacts
        run: |
          set -euo pipefail
          output_dir="apps/desktop/dist/mac-prod"
          artifact_list="${RUNNER_TEMP}/nyx-macos-artifacts.txt"

          find "${output_dir}" -maxdepth 1 -type f \( \
            -name 'nyx-*-mac-arm64.dmg' -o \
            -name 'nyx-*-mac-arm64.zip' -o \
            -name 'latest-mac.yml' -o \
            -name '*.blockmap' \
          \) | sort > "${artifact_list}"

          grep -q '/nyx-.*-mac-arm64\.dmg$' "${artifact_list}"
          grep -q '/nyx-.*-mac-arm64\.zip$' "${artifact_list}"
          grep -q '/latest-mac\.yml$' "${artifact_list}"
          grep -q '\.blockmap$' "${artifact_list}"

          {
            printf 'artifact_list<<EOF\n'
            cat "${artifact_list}"
            printf 'EOF\n'
          } >> "${GITHUB_OUTPUT}"

      - name: Upload GitHub release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_tag="${GITHUB_REF_NAME}"

          if ! gh release view "${release_tag}" >/dev/null 2>&1; then
            gh release create "${release_tag}" \
              --draft \
              --title "Nyx ${release_tag}" \
              --notes "Signed macOS arm64 Nyx release artifacts."
          fi

          mapfile -t artifacts <<< "${{ steps.artifacts.outputs.artifact_list }}"
          gh release upload "${release_tag}" "${artifacts[@]}" --clobber
