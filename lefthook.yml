pre-commit:
  jobs:
    - name: format
      glob:
        - '*.{ts,tsx,js,jsx,mts,cts,json,md,html,css,yml,yaml}'
      run: pnpm exec oxfmt --config apps/desktop/.oxfmtrc.json {staged_files}
      stage_fixed: true

    - name: ocaml-format
      glob:
        - 'runtime/ocaml/**/*.{ml,mli}'
      run: mise run runtime:format
      stage_fixed: true

    - name: lint
      glob:
        - '*.{ts,tsx,js,jsx,mts,cts}'
      run: pnpm exec oxlint {staged_files}

pre-push:
  jobs:
    - name: check
      run: mise run check
